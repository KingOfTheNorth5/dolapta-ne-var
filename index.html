<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Mutfağı Rehberi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-texture"></div>

    <main class="container">
        
        <header>
            <div class="header-top">
                <div></div>
                <button id="themeToggle" class="theme-toggle" title="Gece/Gündüz Modu"><i class="fa-solid fa-moon"></i></button>
            </div>
            <h1>Türk Mutfağı Rehberi</h1>
            <p style="margin-bottom:2rem;">Yüzlerce yıllık lezzet mirasımız, en özel ve ölçülü tariflerle burada.</p>
            
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="globalSearch" class="search-input" placeholder="Tarif ara... (Örn: Mantı, Çorba)" autocomplete="off">
            </div>
        </header>


        <!-- Dolabımda Ne Var -->
        <section class="fridge-section" style="margin-bottom: 3rem; background: var(--card-bg); padding: 2rem; border-radius: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
            <h2 class="section-title"><i class="fa-solid fa-kitchen-set"></i> Dolabımda Ne Var?</h2>
            <div class="fridge-container">
                <p style="color:var(--text-secondary); margin-bottom:1rem;">Elinizdeki malzemeleri yazın, size uygun tarifleri bulalım.</p>
                <div class="fridge-input-group" style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <input type="text" id="ingredientInput" placeholder="Örn: Patlıcan, Kıyma, Domates..." autocomplete="off" style="flex: 1; padding: 0.8rem 1.2rem; border-radius: 50px; border: 1px solid var(--border-color); outline: none; font-family: inherit; font-size: 1rem;">
                    <button id="addIngredientBtn" style="background: var(--bg-color); border: 1px solid var(--accent-primary); color: var(--accent-primary); padding: 0.8rem 1.5rem; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.3s;"><i class="fa-solid fa-plus"></i> Ekle</button>
                    <button id="searchFridgeBtn" style="background: var(--accent-primary); border: none; color: white; padding: 0.8rem 1.5rem; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.3s;"><i class="fa-solid fa-magnifying-glass"></i> Tarif Bul</button>
                    <button id="clearFridgeBtn" style="background: #f1f5f9; border: none; color: var(--text-secondary); padding: 0.8rem 1.5rem; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.3s;" title="Temizle"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="selected-ingredients" id="selectedIngredients" style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                    <!-- Seçilen malzemeler buraya gelecek -->
                </div>
            </div>
        </section>

        <!-- Kategoriler -->
        <section class="categories-section" id="categoriesSection">
            <h2 class="section-title">Kategoriler</h2>
            <div class="categories-container" id="categoriesContainer">
                <!-- Kategori kartları buraya gelecek -->
            </div>
        </section>

        <!-- Yemek Listesi -->
        <section class="meals-section">
            <div class="section-header">
                <h2 class="section-title" id="mealsTitle">Popüler Yemekler</h2>
            </div>
            
            <div class="recipes-grid" id="recipesGrid">
                <!-- Yemek kartları buraya gelecek -->
            </div>
        </section>
    </main>

    <!-- Tarif Detay Modalı -->
    <div id="recipeModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalBody">
                <!-- Modal içeriği JavaScript ile doldurulacak -->
            </div>
        </div>
    </div>

    <!-- Adım Adım Pişirme Modu Modalı -->
    <div id="cookingModeModal" class="modal-overlay hidden">
        <div class="cooking-mode-content">
            <button id="closeCookingModeBtn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            <div class="cooking-progress">
                <div class="progress-bar" id="cookingProgressBar"></div>
            </div>
            <h2 id="cookingModeTitle">Tarif Adı</h2>
            <div class="step-container">
                <h3 id="stepNumber">Adım 1/5</h3>
                <p id="stepText" style="font-size: 1.5rem; line-height: 1.6; margin: 2rem 0; text-align: center; color: var(--text-primary);"></p>
                
                <div id="timerContainer" class="hidden" style="text-align: center; margin-bottom: 2rem;">
                    <div id="timerDisplay" style="font-size: 3rem; font-weight: bold; font-family: monospace; color: var(--accent-primary);">00:00</div>
                    <button id="startTimerBtn" style="padding: 0.5rem 1rem; background: var(--accent-primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem;"><i class="fa-solid fa-play"></i> Başlat</button>
                </div>
            </div>
            <div class="cooking-controls" style="display: flex; justify-content: space-between; margin-top: auto;">
                <button id="prevStepBtn" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Önceki</button>
                <button id="nextStepBtn" class="nav-btn">Sonraki <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Scriptler -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
