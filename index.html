<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroKeşif - Dünya Mutfakları</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1><i class="fa-solid fa-utensils"></i> GastroKeşif</h1>
            <p>Dünya mutfaklarından en lezzetli kategorileri seçin ve keşfetmeye başlayın.</p>
        </header>

        <!-- Kategoriler -->
        <section class="categories-section">
            <h2 class="section-title">Kategoriler</h2>
            <div id="categoriesLoading" class="spinner-container hidden">
                <div class="spinner"></div>
            </div>
            <div class="categories-container" id="categoriesContainer">
                <!-- Kategori kartları buraya gelecek -->
            </div>
        </section>

        <!-- Yemek Listesi -->
        <section class="meals-section">
            <div class="section-header">
                <h2 class="section-title" id="mealsTitle">Popüler Yemekler</h2>
            </div>
            
            <div id="mealsLoading" class="spinner-container hidden">
                <div class="spinner"></div>
            </div>
            
            <div class="recipes-grid" id="recipesGrid">
                <!-- Yemek kartları buraya gelecek -->
            </div>
        </section>
    </main>

    <!-- Tarif Detay Modalı -->
    <div id="recipeModal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <button id="closeModalBtn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalBody">
                <!-- Modal içeriği JavaScript ile doldurulacak -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
