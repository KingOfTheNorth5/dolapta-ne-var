<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolapta Ne Var? - Akıllı Tarif Önerici</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1><i class="fa-solid fa-kitchen-set"></i> Dolapta Ne Var?</h1>
            <p>Elinizdeki malzemeleri girin, size özel tarifleri bulalım.</p>
        </header>

        <section class="search-section glass-panel">
            <div class="input-group">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="ingredientInput" placeholder="Malzeme ekleyin (örn: tavuk, makarna, soğan)...">
                <button id="addBtn">Ekle</button>
            </div>
            <div class="ingredients-list" id="ingredientsList">
                <!-- Chips will appear here -->
            </div>
            <button id="searchRecipesBtn" class="primary-btn" disabled>Tarifleri Bul</button>
        </section>

        <section class="results-section">
            <div id="loadingIndicator" class="hidden">
                <div class="spinner"></div>
                <p>Mutfakta harikalar aranıyor...</p>
            </div>
            
            <div class="recipes-grid" id="recipesGrid">
                <!-- Recipe cards will be injected here -->
            </div>
        </section>
    </main>

    <!-- Recipe Detail Modal -->
    <div id="recipeModal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <button id="closeModalBtn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalBody">
                <!-- Modal content injected by JS -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
